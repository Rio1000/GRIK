<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grik</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3345;
  --text:#e2e4ea;--text-dim:#8b8fa3;--accent:#4f8cff;--accent-dim:#3a6bd4;
  --user-bg:#1e3a5f;--grik-bg:#1f2233;--danger:#ff4f5e;--success:#3dd68c;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}

/* layout */
.app{display:flex;flex-direction:column;height:100%;max-width:800px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
header h1{font-size:18px;font-weight:600;letter-spacing:.5px}
header h1 span{color:var(--accent);font-weight:700}
header .subtitle{font-size:11px;color:var(--text-dim);margin-left:8px}
.controls{display:flex;gap:8px;align-items:center}
.controls button{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;transition:all .15s}
.controls button:hover{border-color:var(--accent);color:var(--text)}
.controls button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);transition:background .3s}
.status-dot.connected{background:var(--success)}
.voice-badge{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);margin-left:6px;white-space:nowrap}
.voice-badge.elevenlabs{background:#1a2a1a;color:var(--success);border-color:#2a3a2a}

/* messages */
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;animation:fadeIn .2s ease}
.msg.user{align-self:flex-end;background:var(--user-bg);border-bottom-right-radius:4px}
.msg.grik{align-self:flex-start;background:var(--grik-bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.system{align-self:center;color:var(--text-dim);font-size:12px;font-style:italic}
.msg .label{font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.thinking{align-self:flex-start;display:flex;gap:4px;padding:12px 18px}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:bounce .6s infinite alternate}
.thinking span:nth-child(2){animation-delay:.2s}
.thinking span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* audio playing indicator */
.msg.grik.speaking{border-color:var(--accent);box-shadow:0 0 12px rgba(79,140,255,.15)}

/* input */
.input-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-bar textarea{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;max-height:120px;line-height:1.4}
.input-bar textarea:focus{border-color:var(--accent)}
.input-bar textarea::placeholder{color:var(--text-dim)}
.btn-icon{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.btn-send{background:var(--accent);color:#fff}
.btn-send:hover{background:var(--accent-dim)}
.btn-send:disabled{opacity:.4;cursor:default}
.btn-mic{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim)}
.btn-mic:hover{border-color:var(--accent);color:var(--text)}
.btn-mic.recording{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.5s infinite}
.btn-mic.transcribing{background:var(--accent);border-color:var(--accent);color:#fff;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,79,94,.4)}50%{box-shadow:0 0 0 8px rgba(255,79,94,0)}}

/* mobile */
@media(max-width:600px){
  .msg{max-width:92%}
  header .subtitle{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="status-dot" id="statusDot"></div>
      <h1><span>G</span>rik</h1>
      <span class="subtitle">General Roaming of Internet Knowledge</span>
      <span class="voice-badge" id="voiceBadge" style="display:none"></span>
    </div>
    <div class="controls">
      <button id="btnTts" title="Toggle spoken replies">&#x1f50a;</button>
      <button id="btnClear" title="New conversation">&#x1f5d1;</button>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="msg system">Say something or tap the mic to talk to Grik.</div>
  </div>

  <div class="input-bar">
    <button class="btn-icon btn-mic" id="btnMic" title="Tap to talk">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Type a message..." autocomplete="off"></textarea>
    <button class="btn-icon btn-send" id="btnSend" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const btnSend = document.getElementById('btnSend');
  const btnMic = document.getElementById('btnMic');
  const btnTts = document.getElementById('btnTts');
  const btnClear = document.getElementById('btnClear');
  const statusDot = document.getElementById('statusDot');
  const voiceBadge = document.getElementById('voiceBadge');

  let ws = null;
  let sessionId = localStorage.getItem('grik-session') || crypto.randomUUID();
  localStorage.setItem('grik-session', sessionId);
  let ttsEnabled = localStorage.getItem('grik-tts') !== 'false';
  let thinkingEl = null;
  let isRecording = false;
  let recognition = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let currentAudio = null;
  let lastGrikMsg = null;

  // server capabilities (filled on load)
  let serverTts = false;
  let serverStt = false;

  if (ttsEnabled) btnTts.classList.add('active');

  // --- Detect capabilities ---
  async function detectCapabilities() {
    try {
      const r = await fetch('/api/capabilities');
      const caps = await r.json();
      serverTts = caps.tts;
      serverStt = caps.stt;
    } catch(e) {
      serverTts = false;
      serverStt = false;
    }
    // show badge
    if (serverTts) {
      voiceBadge.textContent = 'ElevenLabs voice';
      voiceBadge.classList.add('elevenlabs');
    } else if ('speechSynthesis' in window) {
      voiceBadge.textContent = 'Browser voice';
    } else {
      voiceBadge.textContent = 'Text only';
    }
    voiceBadge.style.display = '';

    // set up mic: prefer browser Web Speech API, fall back to server STT
    setupMic();
  }
  detectCapabilities();

  // --- WebSocket ---
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/${sessionId}`);

    ws.onopen = () => statusDot.classList.add('connected');

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      removeThinking();
      setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'thinking') {
        showThinking();
      } else if (data.type === 'reply') {
        removeThinking();
        lastGrikMsg = addMessage('grik', data.text);
        if (ttsEnabled) speak(data.text);
      }
    };
  }
  connect();

  // --- Messages ---
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = role === 'user' ? 'You' : 'Grik';
    div.appendChild(label);
    const body = document.createElement('div');
    body.textContent = text;
    div.appendChild(body);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function showThinking() {
    if (thinkingEl) return;
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking';
    for (let i = 0; i < 3; i++) thinkingEl.appendChild(document.createElement('span'));
    messages.appendChild(thinkingEl);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  // --- Send ---
  function send(text) {
    text = text || input.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    addMessage('user', text);
    ws.send(JSON.stringify({ text }));
    input.value = '';
    autoResize();
  }

  btnSend.addEventListener('click', () => send());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoResize);

  // --- Mic setup ---
  function setupMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      // browser STT available — use it (no server round-trip)
      setupBrowserSTT(SpeechRecognition);
    } else if (serverStt) {
      // no browser STT but server has faster-whisper
      setupServerSTT();
    } else {
      // no STT at all
      btnMic.style.display = 'none';
    }
  }

  function setupBrowserSTT(SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      if (transcript.trim()) send(transcript);
    };

    recognition.onend = () => {
      isRecording = false;
      btnMic.classList.remove('recording');
    };

    recognition.onerror = (e) => {
      isRecording = false;
      btnMic.classList.remove('recording');
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        addMessage('system', 'Mic error: ' + e.error);
      }
    };

    btnMic.addEventListener('click', toggleBrowserSTT);
  }

  function toggleBrowserSTT() {
    if (isRecording) {
      recognition.stop();
    } else {
      isRecording = true;
      btnMic.classList.add('recording');
      recognition.start();
    }
  }

  function setupServerSTT() {
    btnMic.addEventListener('click', toggleServerSTT);
  }

  async function toggleServerSTT() {
    if (isRecording) {
      // stop recording & send to server
      isRecording = false;
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: getMimeType() });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        btnMic.classList.remove('recording');
        btnMic.classList.add('transcribing');

        const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        const form = new FormData();
        form.append('audio', blob, 'recording.webm');

        try {
          const r = await fetch('/api/stt', { method: 'POST', body: form });
          const data = await r.json();
          if (data.text && data.text.trim()) {
            send(data.text.trim());
          }
        } catch(e) {
          addMessage('system', 'Transcription failed: ' + e.message);
        }
        btnMic.classList.remove('transcribing');
      };

      isRecording = true;
      btnMic.classList.add('recording');
      mediaRecorder.start();
    } catch(e) {
      addMessage('system', 'Mic access denied: ' + e.message);
    }
  }

  function getMimeType() {
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) return 'audio/webm;codecs=opus';
    if (MediaRecorder.isTypeSupported('audio/webm')) return 'audio/webm';
    if (MediaRecorder.isTypeSupported('audio/mp4')) return 'audio/mp4';
    return '';
  }

  // --- TTS ---
  async function speak(text) {
    stopAudio();
    if (serverTts) {
      await speakElevenLabs(text);
    } else {
      speakBrowser(text);
    }
  }

  async function speakElevenLabs(text) {
    if (lastGrikMsg) lastGrikMsg.classList.add('speaking');
    try {
      const r = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) { speakBrowser(text); return; }

      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.onended = () => {
        URL.revokeObjectURL(url);
        if (lastGrikMsg) lastGrikMsg.classList.remove('speaking');
        currentAudio = null;
      };
      currentAudio.onerror = () => {
        URL.revokeObjectURL(url);
        if (lastGrikMsg) lastGrikMsg.classList.remove('speaking');
        currentAudio = null;
        speakBrowser(text);
      };
      currentAudio.play();
    } catch(e) {
      if (lastGrikMsg) lastGrikMsg.classList.remove('speaking');
      speakBrowser(text);
    }
  }

  function speakBrowser(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.0;
    utter.pitch = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      /english.*\b(ir|uk|scot)/i.test(v.name) || /\b(moira|fiona|daniel)\b/i.test(v.name)
    );
    if (preferred) utter.voice = preferred;
    if (lastGrikMsg) lastGrikMsg.classList.add('speaking');
    utter.onend = () => { if (lastGrikMsg) lastGrikMsg.classList.remove('speaking'); };
    window.speechSynthesis.speak(utter);
  }

  function stopAudio() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.msg.speaking').forEach(el => el.classList.remove('speaking'));
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {};
  }

  btnTts.addEventListener('click', () => {
    ttsEnabled = !ttsEnabled;
    btnTts.classList.toggle('active', ttsEnabled);
    localStorage.setItem('grik-tts', ttsEnabled);
    if (!ttsEnabled) stopAudio();
  });

  // --- Clear ---
  btnClear.addEventListener('click', () => {
    stopAudio();
    sessionId = crypto.randomUUID();
    localStorage.setItem('grik-session', sessionId);
    messages.innerHTML = '<div class="msg system">New conversation started.</div>';
    if (ws) ws.close();
    connect();
  });

  if (window.innerWidth > 600) input.focus();
})();
</script>
</body>
</html>
